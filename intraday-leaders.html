<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盘中龙头买卖分析 · 超哥 A 股研究台</title>
<style>
:root{--bg:#0f1420;--card:#1a2232;--card2:#212c42;--text:#e8ecf4;--sub:#8b96ab;--line:#2c3a55;--up:#e05656;--down:#3fa372;--gold:#d9a441;--accent:#4a8fe7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);padding:16px;max-width:700px;margin:0 auto;font-size:14px;}
h1{font-size:19px;margin:8px 0 4px;}
.sub{color:var(--sub);font-size:12px;margin-bottom:12px;line-height:1.7;}
a{color:var(--accent);text-decoration:none;}
.back{display:inline-block;margin-bottom:8px;color:var(--sub);font-size:12px;}
h2{font-size:14px;margin:18px 0 8px;padding-left:8px;border-left:3px solid var(--accent);color:var(--sub);}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.nm{font-size:16px;font-weight:700;}
.code{color:var(--sub);font-size:11px;font-family:monospace;}
.px{font-size:19px;font-weight:700;}
.chg{font-size:12px;}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 5px;background:var(--card2);}
.bar i{display:block;height:100%;}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:3px 0;}
.kv b{color:var(--text);}
.adv{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:700;}
.adv.good{background:rgba(63,163,114,.15);color:var(--down);border:1px solid rgba(63,163,114,.45);}
.adv.near{background:rgba(217,164,65,.13);color:var(--gold);border:1px solid rgba(217,164,65,.45);}
.adv.high{background:rgba(224,86,86,.13);color:var(--up);border:1px solid rgba(224,86,86,.45);}
.adv.stop{background:rgba(224,86,86,.2);color:#ff8a8a;border:1.5px solid rgba(224,86,86,.7);}
.adv.wait{background:rgba(139,150,171,.12);color:var(--sub);border:1px solid var(--line);}
.zone{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.7;background:var(--card2);padding:7px 9px;border-radius:7px;}
.zone b{color:var(--gold);}
.warn{background:rgba(224,86,86,.12);border:1px solid rgba(224,86,86,.5);border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.85;margin-bottom:12px;}
.warn b{color:#ff8a8a;}
.bar2{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--sub);margin-bottom:10px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;}
.up{color:var(--up);}.down{color:var(--down);}
.disc{font-size:10px;color:#6b7689;line-height:1.7;margin-top:20px;padding-top:12px;border-top:1px dashed var(--line);text-align:center;}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回研究台</a>
<h1>🎯 盘中龙头买卖分析</h1>
<div class="sub">盘中实时：每只龙头<b>距买卖区多远</b>、现在能不能动手。<b>每次打开/每 60 秒自动刷新。</b><br>买卖区由前一日收盘价与框架 8.13 计算，盘中固定；现价实时变动。</div>

<div class="bar2">
  <button class="btn" onclick="refresh()">🔄 立即刷新</button>
  <span id="updAt">加载中…</span>
</div>

<div id="warnbox"></div>
<div id="list"><div class="warn">⏳ 正在拉取实时行情…</div></div>

<div class="disc">
买卖区算法（框架 8.13）：涨停股 下沿=涨停价×0.96 / 中位=×0.98 / 上沿=涨停价 / 止损=×0.93；趋势中军 围绕收盘价 ±1~3%。<br>
本页为研究辅助与纪律框架，不构成投资建议，不承诺收益。市场有风险，投资需谨慎，盈亏自负。
</div>

<script>
/* 标的池：来自《龙头池与买点_20260911》收盘版，含买卖区（元） */
var POOL=[
 {n:'超声电子',c:'000823',mk:'sz000823',t:'已确认龙头·通信/PCB',lo:19.75,mid:20.16,hi:20.57,stop:19.13,note:'通信板块最强（12只涨停·净流入22.86亿），但换手30.75%分歧大'},
 {n:'中新赛克',c:'002912',mk:'sz002912',t:'已确认龙头·AI应用',lo:22.57,mid:23.04,hi:23.51,stop:21.86,note:'AI应用最高板·一字板抛压小'},
 {n:'闽东电力',c:'000993',mk:'sz000993',t:'候选龙头·电力3板',lo:13.32,mid:13.60,hi:13.88,stop:12.91,note:'电力最高板，但板块无主力资金支撑'},
 {n:'光电股份',c:'600184',mk:'sh600184',t:'萌芽·通信',lo:19.18,mid:19.58,hi:19.98,stop:18.58,note:'通信链跟随·换手7.99%健康'},
 {n:'协和电子',c:'605258',mk:'sh605258',t:'萌芽·PCB',lo:33.38,mid:34.07,hi:34.77,stop:32.34,note:'PCB链跟随'},
 {n:'华胜天成',c:'600410',mk:'sh600410',t:'萌芽·AI应用',lo:14.80,mid:15.11,hi:15.42,stop:14.34,note:'AI应用链跟随'},
 {n:'中际旭创',c:'300308',mk:'sz300308',t:'趋势中军·光模块',lo:898.22,mid:916.74,hi:935.26,stop:861.18,note:'光模块全球龙头·弱市逆势+4.03%'},
 {n:'新易盛',c:'300502',mk:'sz300502',t:'趋势中军·光模块',lo:410.31,mid:418.77,hi:427.23,stop:393.39,note:'光模块二线·+2.94%'},
 {n:'深南电路',c:'002916',mk:'sz002916',t:'趋势中军·PCB',lo:384.78,mid:392.71,hi:400.65,stop:368.91,note:'PCB龙头·+1.11%'},
 {n:'生益科技',c:'600183',mk:'sh600183',t:'趋势中军·覆铜板',lo:143.98,mid:146.95,hi:149.91,stop:138.04,note:'覆铜板龙头·+1.00%'}
];
var Q={}, LEVEL='yellow', HOLD={};

function fmt(n,d){return n==null||isNaN(n)?'-':Number(n).toFixed(d==null?2:d);}
function advise(px,z){
  if(px==null)return {t:'⏳ 行情加载中…',k:'wait'};
  if(px<=z.stop)return {t:'⛔ 已破止损 '+fmt(z.stop)+' → 放弃/离场',k:'stop'};
  if(px<=z.lo)return {t:'🟢 已进入低吸区（≤'+fmt(z.lo)+'）',k:'good'};
  if(px<=z.mid)return {t:'🟡 接近买区下沿，可轻仓试探',k:'near'};
  if(px<=z.hi)return {t:'🟠 介于中位~上沿，等回踩不追高',k:'near'};
  return {t:'🔴 已超上沿 '+fmt(z.hi)+' → 追高风险，不买',k:'high'};
}
function posInBar(px,z){
  // 位置：止损→下沿→中位→上沿 映射到 0~100
  if(px==null)return 50;
  var a=z.stop,b=z.hi; if(px<=a)return 0; if(px>=b)return 100;
  return Math.round((px-a)/(b-a)*100);
}
function render(){
  var list=document.getElementById('list'), wb=document.getElementById('warnbox');
  if(LEVEL==='yellow'||LEVEL==='red'){
    wb.innerHTML='<div class="warn"><b>⚠️ 信号灯 '+(LEVEL==='red'?'🔴 红灯':'🟡 黄灯')+' —— 纪律优先</b><br>'+
      (LEVEL==='red'?'红灯期：<b>只减仓、不开新仓</b>，本页买卖区仅供观察。':'黄灯期：<b>仓位 ≤3 成、禁新仓打板</b>，本页买卖区仅供观察锚。')+
      '</div>';
  }else{ wb.innerHTML=''; }
  var html='';
  ['已确认龙头','候选龙头','萌芽','趋势中军'].forEach(function(grp){
    var items=POOL.filter(function(x){return x.t.indexOf(grp)===0;});
    if(!items.length)return;
    html+='<h2>'+grp+'（'+items.length+'）</h2>';
    items.forEach(function(z){
      var q=Q[z.mk]||null, px=q?q.price:null, chg=q?q.chg:null;
      var cls=chg>0?'up':(chg<0?'down':'');
      var ad=advise(px,z);
      var pct=posInBar(px,z);
      html+='<div class="card">'
        +'<div class="top"><span><span class="nm">'+z.n+'</span> <span class="code">'+z.c+'</span><br><span style="font-size:11px;color:var(--sub)">'+z.t+'</span></span>'
        +'<span style="text-align:right">'+(px!=null?('<div class="px '+cls+'">'+fmt(px)+'</div><div class="chg '+cls+'">'+(chg>=0?'+':'')+fmt(chg)+'%</div>'):'<div class="chg">加载中…</div>')+'</span></div>'
        +'<div class="bar"><i style="width:'+pct+'%;background:'+(pct<25?'var(--down)':(pct>75?'var(--up)':'var(--gold)'))+'"></i></div>'
        +'<div class="kv"><span>止损 <b class="up">'+fmt(z.stop)+'</b></span><span>下沿 <b>'+fmt(z.lo)+'</b></span><span>中位 <b>'+fmt(z.mid)+'</b></span><span>上沿 <b>'+fmt(z.hi)+'</b></span></div>'
        +'<div class="adv '+ad.k+'">'+ad.t+'</div>'
        +'<div class="zone">'+z.note+'</div>'
        +'</div>';
    });
  });
  if(!html)html='<div class="warn">暂无标的</div>';
  list.innerHTML=html;
  document.getElementById('updAt').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN');
}
function loadQuotes(){
  var codes=POOL.map(function(x){return x.mk;});
  var sc=document.createElement('script');
  sc.charset='GBK';
  sc.src='https://qt.gtimg.cn/q='+codes.join(',');
  sc.onload=function(){
    POOL.forEach(function(z){
      var raw=window['v_'+z.mk]; if(!raw)return;
      var f=String(raw).split('~');
      var p=parseFloat(f[3]),c=parseFloat(f[32]);
      if(!isNaN(p))Q[z.mk]={price:p,chg:isNaN(c)?0:c};
    });
    render();
  };
  sc.onerror=function(){render();};
  document.body.appendChild(sc);
}
function loadLevel(){
  fetch('../status.json?v='+Date.now()).then(function(r){return r.json()}).then(function(s){
    LEVEL=(s&&s.level)||'yellow'; render();
  }).catch(function(){});
}
function refresh(){ Q={}; render(); loadQuotes(); loadLevel(); }
refresh();
setInterval(function(){ Q={}; render(); loadQuotes(); }, 60000);
</script>
</body>
</html>
