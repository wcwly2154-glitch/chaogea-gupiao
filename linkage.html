<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据血缘诊断 · 超哥 A 股研究台</title>
<style>
:root{--bg:#0f1420;--card:#1a2232;--card2:#212c42;--text:#e8ecf4;--sub:#8b96ab;--line:#2c3a55;--up:#e05656;--down:#3fa372;--gold:#d9a441;--accent:#4a8fe7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);padding:16px;max-width:680px;margin:0 auto;font-size:14px;}
h1{font-size:20px;margin:10px 0 4px;}
.sub{color:var(--sub);font-size:12px;margin-bottom:14px;line-height:1.7;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
h2{font-size:14px;color:var(--sub);font-weight:400;margin-bottom:10px;}
a{color:var(--accent);text-decoration:none;}
.back{display:inline-block;margin-bottom:10px;color:var(--sub);font-size:12px;}
.ok-box{background:rgba(63,163,114,.1);border:1px solid rgba(63,163,114,.35);border-radius:10px;padding:14px;text-align:center;color:var(--down);font-weight:600;}
.warn-box{background:rgba(224,86,86,.1);border:1px solid rgba(224,86,86,.35);border-radius:10px;padding:14px;color:var(--up);}
.alert-item{background:var(--card2);border-left:3px solid var(--up);border-radius:6px;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.6;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;background:var(--card2);border-radius:6px;overflow:hidden;}
th{color:var(--sub);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:8px;border-bottom:1px solid #21262d;}
tr:last-child td{border-bottom:none;}
.badge{font-family:monospace;font-size:11px;background:rgba(74,143,231,.15);color:var(--accent);padding:1px 5px;border-radius:3px;}
.badge.green{background:rgba(63,163,114,.18);color:var(--down);}
.badge.gray{background:rgba(139,150,171,.18);color:var(--sub);}
.empty{color:var(--sub);font-size:13px;padding:14px;text-align:center;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #21262d;font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--sub);}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回研究台</a>
<h1>🔗 数据血缘诊断</h1>
<div class="sub">校验持仓（holdings）与交易日志（trades）的 <code>holding_id</code> 双向关联完整性。守护进程每轮自动跑一次。</div>

<div id="status" class="card"><div class="empty">⏳ 读取校验结果…</div></div>

<div class="card">
  <h2>校验规则</h2>
  <div class="kv"><span class="k">① 持仓中 trade 必带 holding_id</span><span>且该 holding 必须存在</span></div>
  <div class="kv"><span class="k">② holding.entry_trade_id 必存在</span><span>入口 trade 可追溯</span></div>
  <div class="kv"><span class="k">③ 持仓股数 = Σ买 − Σ卖</span><span>加减验算一致</span></div>
  <div class="kv"><span class="k">④ 已清仓 trade</span><span>holding_id 可为空（保留历史）</span></div>
</div>

<div class="card">
  <h2>当前持仓 ↔ 关联交易</h2>
  <div id="linkTable" class="empty">读取中…</div>
</div>

<script>
function load(k){try{return JSON.parse(localStorage.getItem(k))||[];}catch(e){return[];}}
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;');}
function fmt(n){return n==null?'-':Number(n).toFixed(2);}
var URL_H='/api/holdings', URL_T='/api/trades';

function renderStatus(alerts, checkedAt, ok){
  var el=document.getElementById('status');
  if(ok){
    el.innerHTML='<div class="ok-box">✅ 关联校验通过 · 无告警<br><span style="font-size:11px;font-weight:400;color:var(--sub)">检查时间 '+esc(checkedAt||'-')+'</span></div>';
  }else{
    var h='<div class="warn-box"><b>⚠️ 发现 '+alerts.length+' 条关联告警</b>';
    alerts.forEach(function(a){h+='<div class="alert-item">'+esc(a)+'</div>';});
    h+='</div>';
    el.innerHTML=h;
  }
}
function renderTable(holdings, trades){
  var byH={};
  trades.forEach(function(t){if(t.holding_id){(byH[t.holding_id]=byH[t.holding_id]||[]).push(t);}});
  var html='';
  if(!holdings.length){html='<div class="empty">当前无持仓</div>';}
  else{
    html='<table><tr><th>持仓</th><th>股数</th><th>均价</th><th>止损</th><th>关联交易</th></tr>';
    holdings.forEach(function(h){
      var ts=byH[h.holding_id]||[];
      var buys=ts.filter(function(t){return t.side==='buy';}).length;
      var sells=ts.filter(function(t){return t.side==='sell';}).length;
      var ttag=ts.length?('<span class="badge">'+ts.length+' 笔</span> '+buys+'买/'+sells+'卖'):'<span class="badge gray">⚠️ 无关联</span>';
      html+='<tr><td><b>'+esc(h.name)+'</b><br><span class="badge">'+esc(h.holding_id||'-')+'</span></td>'
        +'<td>'+h.shares+'</td><td>'+fmt(h.avg_cost||h.cost)+'</td><td>'+(h.current_stop?fmt(h.current_stop):'-')+'</td>'
        +'<td>'+ttag+'</td></tr>';
    });
    html+='</table>';
  }
  // 已清仓历史
  var closed=trades.filter(function(t){return !t.holding_id;});
  if(closed.length){
    html+='<div style="margin-top:10px;font-size:12px;color:var(--sub)">已清仓历史（'+closed.length+' 笔·不关联当前持仓）：'
      +closed.map(function(t){return esc(t.name)+'('+t.side+')';}).join('、')+'</div>';
  }
  document.getElementById('linkTable').innerHTML=html;
}

// 并行拉三份：status.json + holdings + trades
Promise.all([
  fetch('status.json?v='+Date.now()).then(function(r){return r.json();}),
  fetch(URL_H+'?v='+Date.now()).then(function(r){return r.json();}),
  fetch(URL_T+'?v='+Date.now()).then(function(r){return r.json();})
]).then(function(rs){
  var st=rs[0]||{}, hd=rs[1]||{}, td=rs[2]||{};
  var lk=(st.sections&&st.sections.linkage)||{};
  renderStatus(lk.alerts||[], lk.checkedAt, lk.ok!==false);
  renderTable(hd.holdings||[], td.trades||[]);
}).catch(function(e){
  document.getElementById('status').innerHTML='<div class="warn-box">⚠️ 读取失败：'+esc(e)+'</div>';
  document.getElementById('linkTable').innerHTML='<div class="empty">数据读取失败</div>';
});
</script>
</body>
</html>
